<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Jarvis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Share+Tech+Mono&display=swap">
<style>
/* Dois jeitos, escolhidos pelo tamanho da janela: tela cheia (o padrão: o reator no meio e as janelas
   de vidro abrindo por cima dele) e painel (janela alta e estreita, com JARVIS_TELA=painel). */
:root {
  --bg: #020a1f;
  --bg-glow: #07306e;
  --panel: rgba(6, 30, 74, .55);
  --glass: rgba(4, 20, 54, .74);
  --line: #1456b8;
  --line-soft: rgba(70, 160, 255, .3);
  --line-strong: rgba(90, 195, 255, .7);
  --cyan: #35c8ff;
  --text: #e6f2ff;
  --muted: #7fa6d6;
  --ok: #4af2a1;
  --warn: #ffb347;
  --raio: 18px;
  --display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --mono: "Share Tech Mono", Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  background: radial-gradient(ellipse at 50% 38%, var(--bg-glow) 0%, var(--bg) 62%) var(--bg);
  color: var(--text); font-family: var(--display); user-select: none;
  display: flex; flex-direction: column; border: 1px solid var(--line);
}
header {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 12px 14px 10px; border-bottom: 1px solid var(--line); cursor: move;
}
h1 { margin: 0; font-weight: 400; letter-spacing: .45em; font-size: 22px; }
.botoes { display: flex; gap: 4px; }
.botoes button {
  width: 28px; height: 24px; border: 1px solid var(--line); background: transparent; color: var(--cyan);
  font: 16px/1 var(--mono); cursor: pointer;
}
.botoes button:hover { background: rgba(95, 230, 240, .12); }
.reator { position: relative; width: 100%; aspect-ratio: 1; flex: none; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.estado { text-align: center; font-family: var(--mono); color: var(--cyan); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; }
.fala { margin: 8px 16px 0; text-align: center; font-size: 16px; min-height: 2.6em; overflow-wrap: anywhere; }
.cartoes { flex: 1; min-height: 0; overflow: hidden auto; scrollbar-width: thin; margin: 8px 14px 0; display: flex; flex-direction: column; gap: 8px; }
.cartao { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--cyan); padding: 8px 12px;
  animation: entra .35s ease-out both; }
.cartao.sai { animation: sai .4s ease-in forwards; }
.cartao small { display: block; font-family: var(--mono); color: var(--muted); font-size: 11px; letter-spacing: .15em; text-transform: uppercase; }
.cartao strong { font-size: 16px; font-weight: 600; display: block; overflow-wrap: anywhere; white-space: pre-line;
  max-height: 11em; overflow: hidden; }
@keyframes led { 50% { opacity: .35; } }
@keyframes onda { from { transform: scaleY(.3); } to { transform: scaleY(1); } }
@keyframes orbe { to { box-shadow: 0 0 40px rgba(53, 200, 255, .95), inset 0 0 14px rgba(53, 200, 255, .6); } }
@keyframes gira { to { transform: rotate(360deg); } }
@keyframes entra { from { opacity: 0; transform: translateY(12px); } }
@keyframes sai { to { opacity: 0; transform: translateY(12px); } }
#form { display: flex; gap: 6px; padding: 10px 14px 14px; border-top: 1px solid var(--line); margin-top: 8px; }
input {
  flex: 1; min-width: 0; background: rgba(8, 40, 48, .4); border: 1px solid var(--line); color: var(--text);
  font: 15px var(--display); padding: 7px 10px; outline: none;
}
input:focus { border-color: var(--cyan); }
input::placeholder { color: var(--muted); }
.relogio, #janelas, .legenda, .orbe, .hud-topo, .disco { display: none; }

/* Tela cheia: o reator no meio, o nome e o relógio em cima, a conversa embaixo
   e as janelas de vidro (cantos arredondados) abrindo do reator para os cantos livres. */
@media (min-width: 600px) {
  body { display: block; border: none;
    background:
      linear-gradient(rgba(60, 140, 255, .11) 1px, transparent 1px) 0 0 / 58px 58px,
      linear-gradient(90deg, rgba(60, 140, 255, .11) 1px, transparent 1px) 0 0 / 58px 58px,
      radial-gradient(ellipse at 50% 46%, var(--bg-glow) 0%, var(--bg) 66%) var(--bg); }
  body::before, body::after { content: ""; position: fixed; left: 0; right: 0; height: 1px; z-index: 0; pointer-events: none;
    background: linear-gradient(90deg, transparent, var(--line-strong) 20%, var(--cyan) 50%, var(--line-strong) 80%, transparent);
    box-shadow: 0 0 14px var(--cyan); opacity: .55; }
  body::before { top: 7vh; opacity: .3; }
  body::after { bottom: 11vh; }
  header { position: fixed; top: 0; left: 0; right: 0; z-index: 5; border: none; cursor: default;
    align-items: flex-start; gap: 18px; padding: 16px clamp(16px, 3vw, 36px) 0; pointer-events: none; }
  h1 { flex: 1; font-weight: 500; font-size: 20px; letter-spacing: .55em; padding-top: 4px; }
  .relogio { display: block; font-family: var(--mono); color: var(--muted); font-size: 13px; letter-spacing: .12em;
    text-align: right; font-variant-numeric: tabular-nums; }
  .relogio b { display: block; color: var(--cyan); font-weight: 400; font-size: 22px; letter-spacing: .08em; }
  .botoes { gap: 8px; pointer-events: auto; padding-top: 4px; }
  .botoes button { width: 30px; height: 30px; border-radius: 50%; border-color: var(--line-soft); background: rgba(5, 24, 30, .6); }
  .botoes button:hover, .botoes button:focus-visible { border-color: var(--cyan); outline: none; }
  .reator { position: fixed; inset: 0; width: 100%; height: 100%; aspect-ratio: auto; }
  .estado { position: fixed; top: max(11vh, 112px); left: 50%; transform: translateX(-50%); z-index: 4; letter-spacing: .55em;
    font-size: 14px; white-space: nowrap; pointer-events: none; text-shadow: 0 0 12px var(--cyan); padding-left: .55em; }
  .estado::after { content: ""; display: block; width: 190px; height: 6px; margin: 9px auto 0; opacity: .7;
    background: repeating-linear-gradient(90deg, var(--line-strong) 0 1px, transparent 1px 4px);
    -webkit-mask: linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent); mask: linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent); }
  .orbe { display: grid; }
  .hud-topo { display: flex; position: fixed; top: 66px; left: 50%; transform: translateX(-50%); z-index: 4; gap: 12px; align-items: center;
    font: 10px var(--mono); letter-spacing: .26em; color: var(--muted); white-space: nowrap; pointer-events: none;
    padding: 5px 16px; border: 1px solid var(--line-soft); border-radius: 999px; background: rgba(4, 20, 54, .55); }
  .hud-topo .led { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); animation: led 2.4s ease-in-out infinite; }
  .hud-topo i { width: 1px; height: 10px; background: var(--line-soft); }
  .orbe { display: grid; place-items: center; position: fixed; left: 50%; bottom: 3.2vh; transform: translateX(-50%); z-index: 6;
    width: 46px; height: 46px; padding: 0; border-radius: 50%; cursor: pointer; color: var(--cyan);
    border: 1px solid var(--line-strong); background: radial-gradient(circle, rgba(53, 200, 255, .28), rgba(4, 20, 54, .85) 70%);
    box-shadow: 0 0 22px rgba(53, 200, 255, .45), inset 0 0 10px rgba(53, 200, 255, .3); transition: transform .2s, box-shadow .2s; }
  .orbe:hover, .orbe:focus-visible { transform: translateX(-50%) scale(1.12); box-shadow: 0 0 34px rgba(53, 200, 255, .8), inset 0 0 12px rgba(53, 200, 255, .5); outline: none; }
  .orbe svg { width: 22px; height: 22px; }
  .orbe .barra-onda { transform-origin: 50% 50%; animation: onda 1.1s ease-in-out infinite alternate; }
  .orbe .barra-onda:nth-child(2) { animation-delay: -.3s; } .orbe .barra-onda:nth-child(3) { animation-delay: -.6s; }
  .orbe .barra-onda:nth-child(4) { animation-delay: -.15s; } .orbe .barra-onda:nth-child(5) { animation-delay: -.45s; }
  body[data-estado="parado"] .orbe .barra-onda { animation-play-state: paused; transform: scaleY(.35); }
  body[data-estado="ouvindo"] .orbe, body[data-estado="falando"] .orbe { animation: orbe 1.2s ease-in-out infinite alternate; }
  .orbe::before { content: ""; position: absolute; inset: -7px; border-radius: 50%; border: 1px dashed var(--line-soft); animation: gira 14s linear infinite; }
  .fala, .cartoes { display: none; }
  #janelas { display: block; position: fixed; inset: 0; z-index: 3; pointer-events: none; }
  .legenda { display: grid; gap: 4px; position: fixed; left: 50%; transform: translateX(-50%); z-index: 4;
    bottom: 12.5vh; width: min(760px, calc(100vw - 32px)); text-align: center; pointer-events: none; }
  .legenda p { margin: 0; font-size: 24px; font-weight: 600; min-height: 1.4em; text-shadow: 0 2px 10px rgba(0, 0, 0, .9), 0 0 24px rgba(20, 90, 220, .6);
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .legenda p:has(span:empty) { visibility: hidden; }
  .legenda b { font: 11px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-right: 10px; }
  .legenda .voce { font-size: 14px; opacity: .75; }
  .legenda .voce, .legenda .eu { font-weight: 500; }
  .legenda .voce span { font-size: 16px; font-weight: 400; color: var(--muted); }
  .legenda .eu b { display: none; }
  .legenda .eu span { color: #fff; }
  #form { position: fixed; left: 50%; transform: translate(-50%, 14px); bottom: calc(3.2vh + 64px); z-index: 5; margin: 0; padding: 0;
    border: none; width: min(560px, calc(100vw - 32px)); opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; }
  #form.aberto { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  input { border-radius: 999px; padding: 9px 18px; background: rgba(5, 24, 30, .7); border-color: var(--line-soft); }
}

.janela {
  position: absolute; width: min(400px, calc(100vw - 32px)); pointer-events: auto;
  background: var(--glass); border: 1px solid var(--line-soft); border-radius: var(--raio);
  -webkit-backdrop-filter: blur(10px) saturate(1.2); backdrop-filter: blur(10px) saturate(1.2);
  box-shadow: 0 18px 50px rgba(0, 0, 0, .45), 0 0 0 1px rgba(0, 0, 0, .3);
}
.janela::before, .janela::after {  /* cantoneiras de HUD, curvas como a janela */
  content: ""; position: absolute; width: 26px; height: 26px; border: 2px solid var(--cyan); pointer-events: none;
}
.janela::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; border-top-left-radius: var(--raio); }
.janela::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; border-bottom-right-radius: var(--raio); }
.janela.frente { border-color: var(--line-strong); box-shadow: 0 18px 50px rgba(0, 0, 0, .5), 0 0 26px rgba(53, 200, 255, .18); }
.janela { transition: box-shadow .25s, border-color .25s; }
.janela:hover { border-color: var(--line-strong); }
.janela .barra { cursor: grab; }
.janela.arrasta { transition: none; user-select: none; } .janela.arrasta .barra { cursor: grabbing; }
.janela::before { z-index: 1; } .janela::after { z-index: 1; }
.varre { position: absolute; left: 0; right: 0; top: 0; height: 2px; pointer-events: none; opacity: 0; border-radius: 2px;
  background: linear-gradient(90deg, transparent, var(--cyan), transparent); box-shadow: 0 0 14px var(--cyan); }
.janela.nova .varre { animation: varre 1.1s ease-out; }
@keyframes varre { 0% { top: 0; opacity: .9; } 100% { top: 100%; opacity: 0; } }
.icone-tipo { width: 28px; height: 28px; flex: none; display: grid; place-items: center; border: 1px solid var(--line-soft);
  border-radius: 8px; background: rgba(53, 200, 255, .08); color: var(--cyan); }
.icone-tipo svg { width: 16px; height: 16px; }
.barra { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; border-bottom: 1px solid var(--line-soft); }
.barra small { flex: 1; min-width: 0; font-family: var(--mono); color: var(--muted); font-size: 11px;
  letter-spacing: .18em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ponto { width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); flex: none; }
.fechar { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line-soft); background: transparent;
  color: var(--cyan); font: 15px/1 var(--mono); cursor: pointer; flex: none; }
.fechar:hover, .fechar:focus-visible { background: rgba(95, 230, 240, .14); outline: none; }
.corpo { padding: 14px; display: grid; gap: 12px; }
.corpo h3 { margin: 0; font-weight: 600; font-size: 19px; line-height: 1.25; overflow-wrap: anywhere; }
.corpo p { margin: 0; }
.texto { font-size: 17px; line-height: 1.4; white-space: pre-line; overflow-wrap: anywhere; max-height: 50vh; overflow: hidden; }
.sub { color: var(--muted); font-size: 14px; white-space: pre-line; }
.dica { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: .08em; }
.tocando { display: flex; gap: 14px; align-items: center; }
.eq { display: flex; gap: 4px; align-items: flex-end; height: 34px; flex: none; }
.eq i { width: 6px; border-radius: 3px; background: var(--cyan); animation: eq 1s ease-in-out infinite alternate; }
.eq i:nth-child(2) { animation-delay: -.3s; } .eq i:nth-child(3) { animation-delay: -.6s; } .eq i:nth-child(4) { animation-delay: -.15s; }
@keyframes eq { from { height: 6px; } to { height: 34px; } }
.lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.lista li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: center; padding: 8px 10px;
  border: 1px solid var(--line-soft); border-radius: 12px; background: rgba(95, 230, 240, .04); }
.lista li:first-child { border-color: var(--line-strong); }
.lista .n { font-family: var(--mono); color: var(--bg); background: var(--cyan); text-align: center; font-size: 13px;
  padding: 2px 0; border-radius: 7px; }
.lista b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pergunta { font-size: 18px; overflow-wrap: anywhere; }
.escolha { display: flex; gap: 8px; }
.escolha button { flex: 1; padding: 9px 12px; font: 600 15px var(--display); letter-spacing: .04em; cursor: pointer;
  border: 1px solid var(--line-strong); border-radius: 12px; background: transparent; color: var(--text); }
.escolha .sim { background: var(--ok); border-color: var(--ok); color: #03140c; }
.escolha button:hover, .escolha button:focus-visible { filter: brightness(1.15); outline: 2px solid var(--cyan); outline-offset: 2px; }
.clima { display: flex; align-items: center; gap: 16px; }
.grau { font-size: 64px; font-weight: 500; line-height: .9; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.clima h3 { margin: 0; }
.detalhes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.detalhes div { border: 1px solid var(--line-soft); border-radius: 12px; padding: 6px 8px; display: grid; gap: 2px; }
.detalhes small { font: 10px var(--mono); color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
.detalhes b { font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
.contato { display: flex; align-items: center; gap: 10px; }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: #2c6e57; color: #fff; display: grid; place-items: center;
  font-weight: 600; font-size: 18px; flex: none; }
.balao { justify-self: end; max-width: 85%; background: #145c43; color: #eafff5; padding: 8px 12px 6px;
  border-radius: 14px 14px 4px 14px; overflow-wrap: anywhere; white-space: pre-line; }
.balao small { display: block; text-align: right; font: 10px var(--mono); opacity: .75; }
.feito { color: var(--ok); font-weight: 600; }
.j-zap .ponto { background: #3fd37a; box-shadow: 0 0 8px #3fd37a; }
.j-aviso { width: min(340px, calc(100vw - 32px)); }
.j-aviso .ponto { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
.j-confirmar .ponto { background: var(--ok); box-shadow: 0 0 8px var(--ok); }

/* ---- pesquisa: o resultado de uma pergunta (placar, resumo, pontos e fontes) ---- */
.j-pesquisa { width: min(540px, calc(100vw - 32px)); transition: width .35s cubic-bezier(.2, .8, .2, 1); }
.j-pesquisa.larga { width: min(820px, calc(100vw - 32px)); }
.j-pesquisa.expandida { width: min(1120px, calc(100vw - 48px)); }
.j-pesquisa.larga .pq-pontos, .j-pesquisa.expandida .pq-pontos { grid-template-columns: repeat(auto-fill, minmax(min(230px, 100%), 1fr)); }
.j-pesquisa.expandida .pq-resumo p { font-size: 17px; }
.j-pesquisa .barra { gap: 6px; }
.j-pesquisa .expandir { display: grid; }
.expandir { display: none; place-items: center; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line-soft); background: transparent;
  color: var(--cyan); font: 14px/1 var(--mono); cursor: pointer; flex: none; padding: 0; }
.expandir:hover, .expandir:focus-visible { background: rgba(95, 230, 240, .14); outline: none; }
.pq-topo { cursor: zoom-in; } .expandida .pq-topo { cursor: zoom-out; }
/* card expandido: o resto do HUD sai da frente (a legenda fica embaixo dele) */
body.foco .legenda, body.foco .estado, body.foco .hud-topo { opacity: 0; }
.legenda, .estado, .hud-topo { transition: opacity .3s; }
.j-pesquisa .barra { position: absolute; top: 10px; right: 10px; z-index: 3; padding: 0; border: 0; display: flex; }
.j-pesquisa .barra small, .j-pesquisa .barra .ponto { display: none; }
.j-pesquisa .corpo { padding: 0; gap: 0; max-height: min(70vh, 900px); overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain;
  grid-template-columns: minmax(0, 1fr); scrollbar-width: thin; scrollbar-color: rgba(53, 200, 255, .35) transparent; }
.j-pesquisa .corpo > *, .pq-sec > *, .pq-item > *, .pq-resumo > * { min-width: 0; }
.pq-sec, .pq-fontes, .pq-resumo { grid-template-columns: minmax(0, 1fr); }
.pq-topo { display: flex; gap: 12px; align-items: flex-start; padding: 16px 80px 10px 16px; }
.pq-topo h3 { font-size: 20px; letter-spacing: -.01em; }
.pq-topo small { display: block; font: 10px var(--mono); letter-spacing: .2em; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
.pq-sec { padding: 6px 16px; display: grid; gap: 8px; }
.pq-rotulo { display: flex; justify-content: space-between; align-items: center; gap: 12px; font: 10px var(--mono); letter-spacing: .2em;
  color: var(--muted); text-transform: uppercase; }
.pq-prog { flex: 0 0 90px; height: 3px; border-radius: 2px; background: rgba(53, 200, 255, .15); overflow: hidden; }
.pq-prog i { display: block; height: 100%; width: 0; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); transition: width 1.2s cubic-bezier(.2, .8, .2, 1); }
.pq-item { display: grid; gap: 6px; padding: 10px 12px; border: 1px solid var(--line-soft); border-radius: 12px;
  background: linear-gradient(135deg, rgba(53, 200, 255, .08), rgba(20, 60, 140, .1)); }
.pq-linha { display: flex; align-items: center; gap: 10px; }
.pq-n { font: 10px var(--mono); padding: 3px 6px; border: 1px solid var(--line-strong); border-radius: 6px; color: var(--cyan); background: rgba(53, 200, 255, .1); }
.pq-nome { font-weight: 600; font-size: 15px; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.pq-pct, .pq-n { flex: none; }
.pq-nome small { font: 9px var(--mono); color: var(--muted); letter-spacing: .1em; margin-left: 6px; }
.pq-pct { font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.pq-barra { height: 4px; border-radius: 3px; background: rgba(53, 200, 255, .14); overflow: hidden; }
.pq-barra i { display: block; height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg, #1f7bff, var(--cyan));
  box-shadow: 0 0 10px rgba(53, 200, 255, .8); transition: width 1.1s cubic-bezier(.2, .8, .2, 1); }
.pq-item:nth-child(3) .pq-barra i { background: linear-gradient(90deg, #5b5bff, #8d7bff); box-shadow: 0 0 10px rgba(141, 123, 255, .7); }
.pq-sub { display: flex; justify-content: space-between; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); min-width: 0; }
.pq-sub > span:first-child { min-width: 0; overflow-wrap: anywhere; }
.pq-selo { font-size: 11px; padding: 3px 9px; border-radius: 999px; border: 1px solid rgba(74, 242, 161, .5); color: var(--ok); background: rgba(74, 242, 161, .08); white-space: nowrap;
  flex: none; max-width: 58%; overflow: hidden; text-overflow: ellipsis; }
.pq-nota { font-size: 13px; font-weight: 600; color: #d3e6ff; padding: 6px 16px; }
.pq-resumo { margin: 6px 16px; padding: 12px 14px; border: 1px solid var(--line-soft); border-left: 3px solid var(--cyan); border-radius: 12px;
  background: rgba(4, 20, 54, .6); display: grid; gap: 6px; }
.pq-resumo small { font: 9px var(--mono); letter-spacing: .24em; color: var(--cyan); }
.pq-resumo p { font-size: 15px; line-height: 1.45; }
.pq-pontos { margin: 6px 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.pq-ponto, .pq-nota, .pq-resumo p, .pq-topo h3 { overflow-wrap: anywhere; }
.pq-ponto { display: flex; gap: 8px; align-items: flex-start; padding: 9px 11px; font-size: 13px; line-height: 1.35;
  border: 1px solid var(--line-soft); border-radius: 12px; background: rgba(53, 200, 255, .05); transition: border-color .2s, transform .2s; }

  color: var(--text); text-decoration: none; background: rgba(53, 200, 255, .04); }
.pq-fonte b { flex: none; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 10px var(--mono); color: var(--cyan); letter-spacing: .06em; }

@media (max-width: 520px) { .pq-pontos { grid-template-columns: minmax(0, 1fr); } }

/* ---- métricas: ícone brilhando com órbita e os números ao lado (sem moldura) ---- */
.janela.j-metrica { width: min(300px, calc(100vw - 32px)); background: none; border: none; box-shadow: none;
  -webkit-backdrop-filter: none; backdrop-filter: none; }
.j-metrica::before, .j-metrica::after, .j-metrica .barra { display: none; }
.j-metrica .corpo { padding: 0; grid-auto-flow: column; align-items: center; gap: 18px; }
.mt-icone { position: relative; width: 120px; height: 120px; flex: none; display: grid; place-items: center; color: var(--cor, #ff9d2e); }
.mt-icone svg { width: 62px; height: 62px; filter: drop-shadow(0 0 10px var(--cor, #ff9d2e)) drop-shadow(0 0 22px var(--cor, #ff9d2e)); animation: flutua 3.2s ease-in-out infinite alternate; }
.mt-icone::before, .mt-icone::after { content: ""; position: absolute; left: 50%; top: 56%; border-radius: 50%; border: 1px solid var(--cor, #ff9d2e);
  transform: translate(-50%, -50%) rotateX(72deg); opacity: .55; box-shadow: 0 0 12px var(--cor, #ff9d2e); }
.mt-icone::before { width: 118px; height: 118px; } .mt-icone::after { width: 84px; height: 84px; opacity: .3; animation: orbita 6s linear infinite; }
@keyframes flutua { to { transform: translateY(-7px); } }
@keyframes orbita { to { transform: translate(-50%, -50%) rotateX(72deg) rotateZ(360deg); } }
.mt-dados { display: grid; gap: 12px; min-width: 0; }

.cartao .escolha { margin-top: 8px; }

.cartao .corpo .pq-topo, .cartao .corpo .pq-sec, .cartao .corpo .pq-pontos, .cartao .corpo .pq-fontes, .cartao .corpo .pq-resumo, .cartao .corpo .pq-nota, .cartao .corpo .pq-pe { margin-left: 0; margin-right: 0; padding-left: 0; padding-right: 0; }

.cartao .mt-icone::before { width: 88px; height: 88px; } .cartao .mt-icone::after { width: 62px; height: 62px; }


/* ---- doca: os cards minimizados ficam na lateral esquerda; clique traz de volta ao centro ---- */
#doca { position: absolute; left: 18px; top: 19vh; display: flex; flex-direction: column; gap: 8px; width: min(250px, 26vw);
  pointer-events: none; transition: opacity .3s; }
#doca::before { content: "JANELAS"; font: 9px var(--mono); letter-spacing: .3em; color: var(--muted); padding-left: 4px; }
#doca:empty::before { display: none; }
body.foco #doca { opacity: 0; pointer-events: none; }
.chip { pointer-events: auto; display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 10px; text-align: left; cursor: pointer;
  color: var(--text); font: inherit; background: var(--glass); border: 1px solid var(--line-soft); border-left: 2px solid var(--cyan);
  border-radius: 12px; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); transition: transform .2s, border-color .2s, box-shadow .2s; }
.chip:hover, .chip:focus-visible { transform: translateX(4px); border-color: var(--line-strong); box-shadow: 0 0 18px rgba(53, 200, 255, .25); outline: none; }
.chip .icone-tipo { width: 26px; height: 26px; }

  color: var(--cyan); font: 15px/1 var(--mono); cursor: pointer; flex: none; padding: 0; }
.mini:hover, .mini:focus-visible { background: rgba(95, 230, 240, .14); outline: none; }

/* ---- disco central (câmera) ---- */
.disco { position: fixed; z-index: 2; border-radius: 50%; pointer-events: none; opacity: 0; transform: scale(.6);
  transition: opacity .6s, transform .6s cubic-bezier(.2, .8, .2, 1); }

.disco::before { content: ""; position: absolute; inset: -9%; border-radius: 50%; border: 2px solid rgba(74, 242, 161, .75);
  box-shadow: 0 0 18px rgba(74, 242, 161, .5), inset 0 0 14px rgba(74, 242, 161, .3); }

.disco .c1 { top: 18%; left: 18%; border-right: 0; border-bottom: 0; } .disco .c2 { top: 18%; right: 18%; border-left: 0; border-bottom: 0; }
.disco .c3 { bottom: 18%; left: 18%; border-right: 0; border-top: 0; } .disco .c4 { bottom: 18%; right: 18%; border-left: 0; border-top: 0; }

  color: var(--ok); white-space: nowrap; text-shadow: 0 0 8px var(--ok); }
.disco.on:not(.cam) video { visibility: hidden; }

/* Celular (a página vem do celular.py, pelo ngrok): a mesma tela, com senha, microfone e a voz tocando nele */

@media (max-width: 599.98px) {
  .celular { height: 100dvh; border: none; padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }

  .celular #form { align-items: center; padding-bottom: max(14px, env(safe-area-inset-bottom)); }
  .celular #form input { border-radius: 999px; padding: 11px 16px; }
}
#entrada { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px;
  background: rgba(2, 8, 11, .94); }
#entrada[hidden] { display: none; }
.caixa-senha { width: min(340px, 100%); display: grid; gap: 12px; text-align: center; }

.caixa-senha input { border-radius: 12px; padding: 12px 14px; text-align: center; }
.caixa-senha button { padding: 12px; border-radius: 12px; border: 1px solid var(--cyan); background: var(--cyan); color: var(--bg);
  font: 600 16px var(--display); letter-spacing: .12em; cursor: pointer; }

@media (prefers-reduced-motion: reduce) { .eq i { animation: none; height: 20px; } }

<body>
<header class="pywebview-drag-region">

  </div>
</header>
<div class="reator pywebview-drag-region"><canvas id="c"></canvas></div>
<div class="hud-topo"><span class="led"></span>SISTEMA ONLINE<i></i>VOICE LINK ARMADO<i></i><span id="hudHora">--:--</span></div>
<div class="estado" id="estado">EM ESPERA</div>
<div class="disco" id="disco"><video id="cam" autoplay muted playsinline></video><span class="canto c1"></span><span class="canto c2"></span><span class="canto c3"></span><span class="canto c4"></span><em id="discoTxt">IDENTIDADE CONFIRMADA</em></div>
<button class="orbe" id="orbe" type="button" title="Escrever um pedido"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path class="barra-onda" d="M4 10v4"/><path class="barra-onda" d="M8 6v12"/><path class="barra-onda" d="M12 3v18"/><path class="barra-onda" d="M16 7v10"/><path class="barra-onda" d="M20 10v4"/></svg></button>

<div class="cartoes" id="cartoes"></div>

  <p class="voce"><b>Você</b><span id="lv"></span></p>
  <p class="eu"><b id="eu">Bolha</b><span id="lb"></span></p>
</div>
<form id="form"><input id="pedido" placeholder="Digite um pedido ou diga &quot;Bolha&quot;" autocomplete="off" enterkeyhint="send"><button type="button" class="mic" id="acao" title="Falar"><svg class="i-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><svg class="i-enviar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l16-8-6 16-2.5-6.5z"/></svg></button></form>

  <form class="caixa-senha" id="formSenha">
    <h2 id="nomeSenha">BOLHA</h2>

    <button type="submit">Entrar</button>
    <p class="erro" id="erroSenha" aria-live="polite"></p>
  </form>
</div>
<script>
const remoto = document.body.classList.contains('celular');  // aberta no celular (celular.py)
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const reduz = matchMedia('(prefers-reduced-motion: reduce)').matches;
const elEstado = document.getElementById('estado');
let W, H, dpr, cheia = false, R = 100, cx = 0, cy = 0, tamPonto = 1;
const CHEIA = '(min-width: 600px)';  // a mesma regra do CSS
function tam() {
  const era = cheia;
  cheia = matchMedia(CHEIA).matches;
  dpr = Math.min(devicePixelRatio || 1, cheia ? 1.5 : 2);
  const r = cv.getBoundingClientRect(); W = r.width; H = r.height;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  R = Math.min(W, H) * (cheia ? (W < 900 ? .26 : .22) : .3);
  cx = W / 2; cy = cheia ? H * .44 : H / 2;
  tamPonto = cheia ? Math.max(1, R / 115) : 1;  // pontos um pouco maiores numa tela grande
  elEstado.style.top = '';
  posDisco();
  // em tela cheia não se arrasta a janela (ela ocupa a tela toda)
  for (const el of document.querySelectorAll('header, .reator')) el.classList.toggle('pywebview-drag-region', !cheia);
  if (cheia) for (const j of abertas.values()) if (!j.min) poe(j.el, j.tipo);
  else if (era) fechaTudo();
}

// Partículas do anel de onda
// 6 membranas onduladas sobrepostas + poeira solta em volta
const CAMADAS = 6, N = remoto ? 500 : 1500, parts = [];
const fases = Array.from({ length: CAMADAS }, (_, k) => ({ f1: 2 + k % 3, f2: 5 + k, ph: k * 1.7, v: .6 + k * .15, r: .96 + k * .025 }));
for (let i = 0; i < N; i++) {
  const poeira = Math.random() < .6;
  parts.push({ a: Math.random() * Math.PI * 2, k: i % CAMADAS, j: (Math.random() - .5) * (poeira ? .22 : .025),
    poeira, s: poeira ? Math.random() * .9 + .4 : Math.random() * 1.1 + .5, o: Math.random() });
}
// Anel de filamentos: 9 fios finos que ondulam e se cruzam, mais poeira de luz em volta
const FIL = remoto ? 6 : 9, PASSOS = remoto ? 110 : 170;
let mx = 0, my = 0, alvoX = 0, alvoY = 0;  // o mouse inclina o reator (paralaxe)
const ondas = [];  // anéis que se abrem quando se clica no reator
addEventListener('pointermove', (e) => { alvoX = (e.clientX / innerWidth - .5) * 2; alvoY = (e.clientY / innerHeight - .5) * 2; });
const elReator = document.querySelector('.reator');
elReator.addEventListener('pointerdown', (e) => { if (cheia) ondas.push({ t0: t, x: e.clientX, y: e.clientY }); voz = Math.max(voz, .9); });

const ESTADOS = {
  // amp: onda do anel · esf: quanto a esfera ondula · pulso: respiração ritmada · fala: pulso que segue a voz
  parado:   { txt: 'EM ESPERA', amp: .02, esf: 0,   pulso: 0,   fala: 0,   giro: .6,  cor: [60, 190, 255], brilho: .6 },
  ouvindo:  { txt: 'OUVINDO',   amp: .04, esf: 1,   pulso: 0,   fala: 0,   giro: .3,  cor: [70, 150, 255], brilho: .85 },
  pensando: { txt: 'PENSANDO',  amp: .03, esf: 0,   pulso: .08, fala: 0,   giro: 1.2, cor: [90, 210, 255], brilho: .9 },
  falando:  { txt: 'FALANDO',   amp: .06, esf: 1,   pulso: 0,   fala: .12, giro: .4,  cor: [100, 225, 255], brilho: 1 },
};
let estado = 'parado', atual = { ...ESTADOS.parado }, voz = 0, t = 0, angulo = 0, abafado = 0;

function mistura(alvo, k) {
  for (const c of ['amp', 'esf', 'pulso', 'fala']) atual[c] += (alvo[c] - atual[c]) * k;
  atual.giro += (alvo.giro - atual.giro) * k;
  atual.brilho += (alvo.brilho - atual.brilho) * k;
  atual.cor = atual.cor.map((c, i) => c + (alvo.cor[i] - c) * k);
}

function rgba(a) { const [r, g, b] = atual.cor; return `rgba(${r|0},${g|0},${b|0},${a})`; }

// Milhares de pontinhos com transparências diferentes: a cor é escolhida uma vez por quadro e cada
// ponto só muda o globalAlpha (um número), em vez de montar e interpretar um texto rgba() por ponto.
function ponto(x, y, s, alfa) { ctx.globalAlpha = alfa > 1 ? 1 : alfa < 0 ? 0 : alfa; ctx.fillRect(x, y, s, s); }

// 60 quadros por segundo ouvindo, pensando ou falando; em espera, 30 (gira igual, gasta menos CPU).
// O passo vem do tempo de verdade: a velocidade não muda com o fps nem quando um quadro atrasa.
let ultimoQ = 0;
function quadro(agora) {
  requestAnimationFrame(quadro);
  if (document.hidden) { ultimoQ = 0; return; }
  const minimo = 1000 / (estado === 'parado' ? 30 : 60);
  if (ultimoQ && agora - ultimoQ < minimo - 2) return;
  const f = ultimoQ ? Math.min(3, (agora - ultimoQ) / (1000 / 30)) : 1;  // 1 = um quadro a 30 fps
  ultimoQ = agora;
  t += (reduz ? 0.004 : 0.032) * f;
  mistura(ESTADOS[estado], 1 - Math.pow(1 - .06, f));
  // com janelas abertas na tela cheia o reator fica mais apagado, para o conteúdo ficar na frente
  abafado += ((cheia && camada.querySelector('.janela:not(.j-aviso):not(.min)') ? 1 : 0) - abafado) * .05 * f;
  const brilho = atual.brilho * (1 - abafado * .35);
  // Voz simulada: a sua (ouvindo) ou a dele (falando), em sílabas irregulares
  const alvoVoz = estado === 'falando' ? Math.abs(Math.sin(t * 9) * Math.sin(t * 3.7 + 1))
                : estado === 'ouvindo' ? Math.abs(Math.sin(t * 7) * Math.sin(t * 2.3 + .5)) : 0;
  voz += (alvoVoz - voz) * (1 - Math.pow(1 - .25, f));
  // Escala geral: respira ao pensar, pulsa com a voz ao falar
  const escala = 1 + atual.pulso * (.5 + .5 * Math.sin(t * 5)) + atual.fala * voz * .6;

  ctx.clearRect(0, 0, W, H);

  // Brilho de fundo
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * (cheia ? 1.8 : 1.6));
  g.addColorStop(0, rgba(.10 * brilho)); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // Mouse: o reator acompanha de leve (cada fio com uma profundidade)
  mx += (alvoX - mx) * .05 * f; my += (alvoY - my) * .05 * f;

  // Réguas de HUD em volta (só na tela cheia): marcas finas girando em sentidos opostos
  if (cheia) {
    const rot = t * .12 * atual.giro;
    ctx.lineWidth = 1;
    ctx.strokeStyle = rgba(.3 * (1 - abafado * .5));
    for (let i = 0; i < 90; i++) {
      const a = rot + i * Math.PI * 2 / 90, longa = i % 5 === 0, r0 = R * 1.42, r1 = r0 + (longa ? 9 : 4);
      ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0); ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1); ctx.stroke();
    }
    ctx.strokeStyle = rgba(.5 * (1 - abafado * .5)); ctx.lineWidth = 2;
    for (let k = 0; k < 3; k++) {
      const a0 = -rot * 1.6 + k * Math.PI * 2 / 3; ctx.beginPath(); ctx.arc(cx, cy, R * 1.58, a0, a0 + .5); ctx.stroke();
    }
  }

  // Filamentos
  ctx.globalCompositeOperation = 'lighter';
  const nos = [], ampFio = atual.amp * 3.2 + voz * .09 * atual.esf;
  const raioFio = (k, a) => {
    const F = fases[k % CAMADAS];
    const onda = Math.sin(a * F.f1 + t * F.v + F.ph + k) * .6 + Math.sin(a * (F.f2 - 2) - t * F.v * 1.3 + F.ph) * .3
               + Math.sin(a * 7 + t * 3 + F.ph) * voz * .35;
    return R * escala * (.93 + k * .016 + ampFio * onda);
  };
  for (let k = 0; k < FIL; k++) {
    const prof = 1 + k * .05, ox = mx * 9 * prof, oy = my * 6 * prof;
    const giro = t * .05 * atual.giro * (k % 2 ? 1 : -1), pth = new Path2D();
    for (let i = 0; i <= PASSOS; i++) {
      const a = i / PASSOS * Math.PI * 2, r = raioFio(k, a);
      const x = cx + ox + Math.cos(a + giro) * r, y = cy + oy + Math.sin(a + giro) * r;
      if (i) pth.lineTo(x, y); else pth.moveTo(x, y);
    }
    if (k % 3 === 0) {  // uma esfera de luz desliza por este fio, sem pular de ponto em ponto
      const a = k * 2.1 + t * .22 * (k % 2 ? -1 : 1), r = raioFio(k, a);
      nos.push([cx + ox + Math.cos(a + giro) * r, cy + oy + Math.sin(a + giro) * r]);
    }
    pth.closePath();
    ctx.lineWidth = 3.4 * tamPonto; ctx.strokeStyle = rgba(.05 * brilho); ctx.stroke(pth);
    ctx.lineWidth = .9 * Math.max(1, tamPonto * .8); ctx.strokeStyle = rgba((.3 + (k % 3) * .12) * brilho); ctx.stroke(pth);
  }
  // esferas de luz correndo pelos fios: halo largo + miolo branco-azulado
  for (const [x, y] of nos) {
    const h = 18 * tamPonto, gl = ctx.createRadialGradient(x, y, 0, x, y, h);
    gl.addColorStop(0, rgba(.85 * brilho)); gl.addColorStop(.25, rgba(.35 * brilho)); gl.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gl; ctx.fillRect(x - h, y - h, h * 2, h * 2);
    ctx.fillStyle = `rgba(230,248,255,${.9 * brilho})`; ctx.beginPath(); ctx.arc(x, y, 1.8 * tamPonto, 0, Math.PI * 2); ctx.fill();
  }

  // Poeira de luz
  ctx.fillStyle = rgba(1);
  for (const p of parts) {
    const F = fases[p.k];
    const onda = Math.sin(p.a * F.f1 + t * F.v + F.ph) * .55 + Math.sin(p.a * F.f2 - t * F.v * 1.6 + F.ph) * .3
               + Math.sin(p.a * 13 + t * 5 + F.ph) * voz * .8;
    const r = R * escala * (F.r + (atual.amp * 2 + voz * .12 * atual.esf) * onda + p.j);
    const a = p.a + t * .04 * atual.giro * (p.k % 2 ? 1 : -1);
    ponto(cx + mx * 9 + Math.cos(a) * r, cy + my * 6 + Math.sin(a) * r, p.s * tamPonto, (p.poeira ? .18 + p.o * .3 : .22 + p.o * .45) * brilho);
  }

  // Ondas de clique
  ctx.globalAlpha = 1; ctx.lineWidth = 2;
  for (let i = ondas.length - 1; i >= 0; i--) {
    const w = ondas[i], q = (t - w.t0) / 1.1;
    if (q >= 1) { ondas.splice(i, 1); continue; }
    ctx.strokeStyle = rgba((1 - q) * .55); ctx.beginPath(); ctx.arc(w.x, w.y, 10 + q * R * 1.3, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

// Disco central: aparece com a câmera ligada (ui.camera) e mostra "identidade confirmada"

let fluxoCam = null;

window.camera = async (ligar, texto) => {

// Orbe de baixo: abre e fecha a caixa de pedido. Digitar em qualquer lugar também abre.

}

// ============ Janelas da tela cheia ============
// Cada aviso do Jarvis vira uma janela de vidro que nasce do reator e vai para um canto livre.
// Some sozinha depois de um tempo (o mouse em cima segura).
const camada = document.getElementById('janelas');
const abertas = new Map();  // tipo -> { el, tipo, timer }
let z = 10;
const CANTOS = [
  { left: '4vw', top: '14vh' }, { right: '4vw', top: '14vh' },
  { left: '5vw', bottom: '22vh' }, { right: '5vw', bottom: '22vh' },
];
// Os cards grandes vão para o PALCO (centro); o anterior minimiza para a doca da esquerda
const PALCO = new Set(['pesquisa', 'lista', 'texto', 'clima', 'zap']);
const LUGAR = { musica: { canto: 1 }, lista: { palco: true }, texto: { palco: true }, clima: { palco: true }, zap: { palco: true },
  confirmar: { centro: true }, aviso: { aviso: true }, pesquisa: { pesquisa: true }, metrica: { metrica: true } };
const TITULO = { 'tocando agora': 'musica', confirmar: 'confirmar', lembrete: 'aviso', 'sugestão': 'aviso', sugestao: 'aviso',
  clima: 'clima', whatsapp: 'zap' };
const CLIMA = /^(.*?):\s*(.*?),\s*([+-]?\d+)\s*°C\s*\(sensação\s*([+-]?\d+)\s*°C\),\s*umidade\s*(\d+%),\s*vento\s*(.*)$/i;
const MANDO = /^Mando "([\s\S]*)" para (.+?)\?$/;
const ENVIADO = /^Enviado para (.+?): ([\s\S]*)$/;
const hora = () => new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

function conversa(nome, mensagem, enviada) {
  const box = cria('div', 'contato'), quem = cria('div');
  quem.append(cria('h3', '', nome), cria('p', 'sub', 'WhatsApp'));
  box.append(cria('span', 'avatar', (nome.trim()[0] || '?').toUpperCase()), quem);
  const balao = cria('div', 'balao', mensagem);
  balao.append(cria('small', '', enviada ? `${hora()} ✓✓` : hora()));

}

// Cartões "ricos" chegam como JSON: {"titulo":..., "ranking":[...], "resumo":...} (pesquisa) ou {"icone":..., "itens":[...]} (métrica)
function jsonDe(valor) { try { const d = JSON.parse(valor); return d && typeof d === 'object' ? d : null; } catch { return null; } }
function tipoDe(rotulo, valor) {
  const nome = String(rotulo).trim().toLowerCase();
  if (/^pesquisa\b/.test(nome) && jsonDe(valor)) return 'pesquisa';
  if (/^m[ée]trica\b/.test(nome) && jsonDe(valor)) return 'metrica';
  const t = TITULO[nome];
  if (t === 'clima' && !CLIMA.test(valor.trim())) return 'texto';  // formato diferente: mostra o texto
  if (t) return t;
  return /^\s*\d+[.)]\s/m.test(valor) ? 'lista' : 'texto';
}

function cria(tag, classe, texto) {
  const el = document.createElement(tag);
  if (classe) el.className = classe;
  if (texto !== undefined) el.textContent = texto;  // sempre como texto: nome de arquivo com < não vira HTML
  return el;
}

function conteudo(tipo, valor) {
  const corpo = cria('div', 'corpo');
  if (tipo === 'musica') {
    const linha = cria('div', 'tocando'), eq = cria('div', 'eq');
    for (let i = 0; i < 4; i++) eq.append(cria('i'));
    linha.append(eq, cria('h3', '', valor));
    corpo.append(linha, cria('p', 'dica', 'Diga "pausa", "pula esse" ou "tela cheia"'));
  } else if (tipo === 'lista') {
    const ul = cria('ul', 'lista'), resto = [];
    for (const linha of valor.split('\n')) {
      const m = linha.match(/^\s*(\d+)[.)]\s+(.*)$/);
      if (m && ul.children.length < 8) {
        const li = cria('li');
        li.append(cria('span', 'n', m[1]), cria('b', '', m[2]));
        li.title = m[2];
        ul.append(li);
      } else if (!m && linha.trim()) resto.push(linha.trim());
    }
    if (resto.length) corpo.append(cria('p', 'sub', resto.join('\n')));
    corpo.append(ul);
  } else if (tipo === 'clima') {
    const [, cidade, ceu, grau, sensacao, umidade, vento] = valor.trim().match(CLIMA);
    const topo = cria('div', 'clima'), nome = cria('div');
    nome.append(cria('h3', '', cidade), cria('p', 'sub', ceu));
    topo.append(cria('span', 'grau', `${parseInt(grau, 10)}°`), nome);
    const det = cria('div', 'detalhes');
    for (const [k, v] of [['sensação', `${parseInt(sensacao, 10)}°`], ['umidade', umidade], ['vento', vento]]) {
      const d = cria('div'); d.append(cria('small', '', k), cria('b', '', v)); det.append(d);
    }
    corpo.append(topo, det);
  } else if (tipo === 'zap') {
    const m = valor.match(ENVIADO);
    if (m) corpo.append(...conversa(m[1], m[2], true), cria('p', 'feito', '✓ Enviada'));
    else corpo.append(cria('p', 'texto', valor));
  } else if (tipo === 'pesquisa') {
    corpo.append(...pesquisa(jsonDe(valor)));
  } else if (tipo === 'metrica') {
    corpo.append(...metrica(jsonDe(valor)));
  } else if (tipo === 'confirmar') {
    const zap = valor.match(MANDO);
    if (zap) corpo.append(...conversa(zap[2], zap[1], false));
    corpo.append(cria('p', 'pergunta', zap ? 'Posso enviar?' : valor), simNao(),
      cria('p', 'dica', remoto ? 'Ou toque no microfone e diga "sim"' : 'Ou diga "sim" ou "não"'));
  } else {
    corpo.append(cria('p', 'texto', valor));
  }
  return corpo;
}

const SVGNS = 'http://www.w3.org/2000/svg';

function icone(nome, grande) {
  const svg = document.createElementNS(SVGNS, 'svg');

}
const ICONE_TIPO = { musica: 'musica', lista: 'arquivos', clima: 'info', pesquisa: 'pesquisa', texto: 'info', aviso: 'relogio' };

// ---------- pesquisa ----------
function pesquisa(d) {
  const lista = (x) => Array.isArray(x) ? x : [], txt = (x) => String(x ?? '');
  const saida = [], topo = cria('div', 'pq-topo'), tt = cria('div');
  const ic = cria('span', 'icone-tipo'); ic.append(icone('pesquisa'));
  if (d.tema) tt.append(cria('small', '', `Pesquisa · ${txt(d.tema)}`));
  tt.append(cria('h3', '', txt(d.titulo || d.tema || 'Resultado')));
  topo.append(ic, tt); saida.push(topo);
  const barras = [];
  const obj = (x) => x && typeof x === 'object';
  const ranking = lista(d.ranking).filter(obj).slice(0, 6);
  if (ranking.length) {
    const sec = cria('div', 'pq-sec'), rot = cria('div', 'pq-rotulo');
    rot.append(cria('span', '', txt(d.contexto || 'Resultado')));
    const prog = obj(d.progresso) ? parseFloat(String(d.progresso.valor ?? '').replace(',', '.')) : NaN;
    if (!isNaN(prog)) {
      const pr = cria('span', '', txt(d.progresso.rotulo || `${prog}%`)), tr = cria('span', 'pq-prog'), bi = cria('i');
      tr.append(bi); barras.push([bi, Math.min(100, Math.max(0, prog))]); rot.append(pr, tr);
    }
    sec.append(rot);
    ranking.forEach((r, i) => {
      const it = cria('div', 'pq-item'), l = cria('div', 'pq-linha'), nome = cria('span', 'pq-nome', txt(r.nome));
      if (r.sigla) nome.append(cria('small', '', txt(r.sigla)));
      l.append(cria('span', 'pq-n', String(i + 1).padStart(2, '0')), nome);
      const pct = parseFloat(String(r.pct ?? r.valor ?? '').replace(',', '.'));
      if ((r.pct ?? r.valor) != null && txt(r.pct ?? r.valor).trim()) l.append(cria('span', 'pq-pct', /[%a-z]/i.test(txt(r.pct ?? r.valor)) ? txt(r.pct ?? r.valor) : `${txt(r.pct ?? r.valor)}%`));
      it.append(l);
      if (!isNaN(pct)) { const br = cria('div', 'pq-barra'), bi = cria('i'); br.append(bi); it.append(br); barras.push([bi, Math.min(100, Math.max(0, pct))]); }
      if (r.detalhe || r.selo) {
        const sb = cria('div', 'pq-sub'); sb.append(cria('span', '', txt(r.detalhe)));
        if (r.selo) sb.append(cria('span', 'pq-selo', txt(r.selo)));
        it.append(sb);
      }
      sec.append(it);
    });
    saida.push(sec);
  }
  if (d.nota) saida.push(cria('p', 'pq-nota', txt(d.nota)));
  if (d.resumo) { const r = cria('div', 'pq-resumo'); r.append(cria('small', '', 'EM RESUMO'), cria('p', '', txt(d.resumo))); saida.push(r); }
  const pontos = lista(d.pontos).slice(0, 6);
  if (pontos.length) { const g = cria('div', 'pq-pontos'); for (const t of pontos) g.append(cria('div', 'pq-ponto', txt(t))); saida.push(g); }
  const fontes = lista(d.fontes).filter(obj).slice(0, 4);
  if (fontes.length) {
    const g = cria('div', 'pq-fontes');
    for (const f of fontes) {
      const a = cria('div', 'pq-fonte'); a.append(cria('b', '', txt(f.nome || f.site || 'fonte')), cria('span', '', txt(f.titulo || f.url || '')));
      g.append(a);
    }
    saida.push(g);
  }
  const pe = cria('div', 'pq-pe');
  pe.append(cria('span', '', `${fontes.length || lista(d.fontes).length || 0} fontes`), cria('span', '', `Consultado às ${txt(d.hora || hora())}`));
  saida.push(pe);
  // as barras crescem depois que a janela entra
  setTimeout(() => barras.forEach(([el, v]) => { el.style.width = `${v}%`; }), 350);
  return saida;
}

// ---------- métrica: ícone com órbita + números ----------
const CORES = { laranja: '#ff9d2e', verde: '#3dff9a', azul: '#35c8ff', roxo: '#a58bff', vermelho: '#ff5470' };
function metrica(d) {
  const ic = cria('div', 'mt-icone'), dados = cria('div', 'mt-dados');
  ic.style.setProperty('--cor', CORES[d.cor] || CORES.azul);
  dados.style.setProperty('--cor', CORES[d.cor] || CORES.azul);
  ic.append(icone(d.icone, true));
  for (const i of (Array.isArray(d.itens) ? d.itens : []).filter(x => x && typeof x === 'object').slice(0, 4)) {
    const x = cria('div', 'mt-dado');
    x.append(cria('small', '', String(i.r ?? '')), cria('b', '', String(i.v ?? '')));
    if (i.s) x.append(cria('span', '', String(i.s)));
    dados.append(x);
  }
  return [ic, dados];
}

function simNao() {
  const escolha = cria('div', 'escolha'), sim = cria('button', 'sim', 'Sim'), nao = cria('button', '', 'Não');
  sim.type = nao.type = 'button';
  sim.onclick = () => responde('sim');
  nao.onclick = () => responde('não');
  escolha.append(sim, nao);
  return escolha;
}

function tiraConfirmar() { elCartoes.querySelectorAll('.cartao.confirmar').forEach(c => c.remove()); }

function responde(texto) {
  fecha('confirmar');
  tiraConfirmar();
  if (api()) api().pedido(texto);
}

function aplica(el, pos) { for (const k of ['left', 'right', 'top', 'bottom']) el.style[k] = pos[k] || ''; }
function bate(a, b) { return !(a.right <= b.left || b.right <= a.left || a.bottom <= b.top || b.bottom <= a.top); }

function poe(el, tipo) {
  const lugar = LUGAR[tipo];
  if (lugar.aviso) { aplica(el, { right: '4vw', bottom: '22vh' }); return; }  // lembrete: canto de baixo, fora do palco
  if (lugar.pesquisa) { tamanhoPesquisa(el); return; }
  if (lugar.palco) { aplica(el, { left: `calc(50% - ${el.offsetWidth / 2}px)`, top: `${Math.round(Math.max(140, innerHeight * .17))}px` }); return; }
  if (lugar.metrica) {
    const direita = [...abertas.values()].filter(j => j.el !== el && j.tipo === 'metrica').length % 2;  // a segunda vai para a esquerda
    aplica(el, direita ? { left: '7vw', top: `${Math.max(120, cy - 70)}px` } : { right: '7vw', top: `${Math.max(120, cy - 70)}px` });
    return;
  }
  if (lugar.centro) { aplica(el, { left: `calc(50% - ${Math.min(400, innerWidth - 32) / 2}px)`, top: `${Math.max(80, cy - 140)}px` }); return; }
  // o canto preferido; se já tiver outra janela lá, o próximo livre
  const outras = [...abertas.values()].filter(j => j.el !== el && LUGAR[j.tipo].canto !== undefined).map(j => j.el.getBoundingClientRect());
  for (const i of [lugar.canto, ...[0, 1, 2, 3].filter(i => i !== lugar.canto)]) {
    aplica(el, CANTOS[i]);
    if (!outras.some(o => bate(el.getBoundingClientRect(), o))) return;
  }
  aplica(el, CANTOS[lugar.canto]);  // tudo ocupado: fica no preferido, por cima
}

// A pesquisa cresce quando precisa: mais larga se a resposta é grande e alta até a legenda.
// Expandida (botão ⤢ ou duplo clique no título), ocupa quase a tela toda e o HUD sai da frente.
function precisaLarga(d) {
  if (!d) return false;
  const lista = (x) => Array.isArray(x) ? x : [];
  const texto = [d.resumo, d.nota, ...lista(d.pontos), ...lista(d.fontes).map(f => f && f.titulo)].join(' ').length;
  return texto > 420 || lista(d.pontos).length >= 4 || lista(d.ranking).length >= 3;
}
function tamanhoPesquisa(el) {
  const exp = el.classList.contains('expandida'), corpo = el.querySelector('.corpo');
  const topo = exp ? 68 : Math.round(Math.max(140, innerHeight * .17));  // expandida: logo abaixo do cabeçalho
  // normal: até a legenda (2 linhas); expandida: até o orbe de baixo
  const limite = exp ? innerHeight * (1 - .032) - 64 : innerHeight * (1 - .125) - 92;
  aplica(el, { left: `calc(50% - ${el.offsetWidth / 2}px)`, top: `${topo}px` });
  if (corpo) corpo.style.maxHeight = `${Math.max(240, limite - topo)}px`;
}
function expande(el, sim) {
  el.classList.toggle('expandida', sim);
  document.body.classList.toggle('foco', !!document.querySelector('.j-pesquisa.expandida'));
  const b = el.querySelector('.expandir');
  if (b) { b.textContent = sim ? '⤡' : '⤢'; b.title = sim ? 'Diminuir' : 'Expandir'; }
  tamanhoPesquisa(el);
  setTimeout(() => el.isConnected && tamanhoPesquisa(el), 380);  // de novo depois da largura animar
}

// Arrastar a janela pela barra
function arrasta(el, barra) {
  barra.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button')) return;
    const r = el.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top;
    el.classList.add('arrasta'); barra.setPointerCapture(e.pointerId);
    aplica(el, { left: `${r.left}px`, top: `${r.top}px` });
    const mexe = (ev) => aplica(el, { left: `${Math.max(0, Math.min(innerWidth - 60, ev.clientX - dx))}px`, top: `${Math.max(0, Math.min(innerHeight - 40, ev.clientY - dy))}px` });
    const solta = () => { el.classList.remove('arrasta'); barra.removeEventListener('pointermove', mexe); barra.removeEventListener('pointerup', solta); barra.removeEventListener('pointercancel', solta); };
    barra.addEventListener('pointermove', mexe); barra.addEventListener('pointerup', solta); barra.addEventListener('pointercancel', solta);
  });
}

// A pesquisa é longa: rola sozinha, devagar, enquanto ele fala (o mouse em cima para)
function rolaDevagar(corpo, j, ms) {
  if (reduz) return;
  const dur = Math.max(6000, Math.min(ms * .7, 40000)), ini = performance.now() + 2500;
  let pos = 0;
  (function passo(agora) {
    if (!corpo.isConnected) return;
    const max = corpo.scrollHeight - corpo.clientHeight;
    if (max > 0 && agora > ini && !j.parado) { pos = Math.max(pos, Math.min(max, (agora - ini) / dur * max)); corpo.scrollTop = pos; }
    else if (j.parado) pos = corpo.scrollTop;
    requestAnimationFrame(passo);
  })(performance.now());
}

function frente(el) {
  el.style.zIndex = ++z;
  camada.querySelectorAll('.janela').forEach(j => j.classList.toggle('frente', j === el));
}

function agenda(j, ms) {
  clearTimeout(j.timer);
  // o card do palco, quando acaba o tempo, vai para a doca (não some); os outros fecham
  if (ms > 0) { j.fim = Date.now() + ms; j.timer = setTimeout(() => (PALCO.has(j.tipo) && !j.min ? minimiza(j) : fecha(j.chave)), ms); }
}

function abreJanela(rotulo, valor, ms) {
  const tipo = tipoDe(rotulo, valor), palco = PALCO.has(tipo);
  const chave = palco ? `${tipo}#${++seqJanela}` : tipo;
  if (!palco && abertas.has(chave)) fecha(chave, true);  // aviso, música...: o novo troca o velho
  if (palco) for (const o of [...abertas.values()]) if (PALCO.has(o.tipo) && !o.min) minimiza(o);  // o do centro vai para a doca
  const el = cria('section', `janela j-${tipo}`);  // j-: não mistura com as classes de dentro
  el.setAttribute('aria-label', rotulo);
  const barra = cria('div', 'barra'), x = cria('button', 'fechar', '×');
  x.type = 'button'; x.title = 'Fechar'; x.onclick = () => fecha(chave);
  barra.append(cria('span', 'ponto'), cria('small', '', rotulo));
  if (palco) {
    const mn = cria('button', 'mini', '–');
    mn.type = 'button'; mn.title = 'Minimizar para a lateral'; mn.onclick = () => minimiza(abertas.get(chave));
    barra.append(mn);
  }
  if (tipo === 'pesquisa') {
    const ex = cria('button', 'expandir', '⤢');
    ex.type = 'button'; ex.title = 'Expandir'; ex.onclick = () => expande(el, !el.classList.contains('expandida'));
    barra.append(ex);
    el.classList.toggle('larga', precisaLarga(jsonDe(valor)));
  }
  barra.append(x);
  el.append(cria('i', 'varre'), barra, conteudo(tipo, valor));
  if (tipo === 'pesquisa') el.querySelector('.pq-topo').addEventListener('dblclick', () => expande(el, !el.classList.contains('expandida')));
  el.classList.add('nova'); setTimeout(() => el.classList.remove('nova'), 1200);
  const j = { el, tipo, chave, rotulo, titulo: tituloCurto(tipo, valor), timer: null };
  el.addEventListener('pointerdown', () => frente(el));
  arrasta(el, barra);
  if (tipo === 'pesquisa') arrasta(el, el.querySelector('.pq-topo'));  // a pesquisa também arrasta pelo título
  if (tipo === 'pesquisa') rolaDevagar(el.querySelector('.corpo'), j, ms);
  el.addEventListener('mouseenter', () => { clearTimeout(j.timer); j.parado = true; });  // lendo: não some
  el.addEventListener('mouseleave', () => { j.parado = false; if (!j.min) agenda(j, Math.max(3000, (j.fim || 0) - Date.now())); });
  camada.append(el);  // precisa estar na tela para medir onde cabe
  poe(el, tipo);
  abertas.set(chave, j);
  frente(el);
  agenda(j, ms);
  if (!reduz) {  // nasce do reator e voa até o lugar
    const r = el.getBoundingClientRect();
    el.animate([{ transform: `translate(${cx - r.left - r.width / 2}px, ${cy - r.top - r.height / 2}px) scale(.2)`, opacity: 0 },
                { transform: 'none', opacity: 1 }], { duration: 520, easing: 'cubic-bezier(.2,.8,.2,1)' });
  }
}

function fecha(chave, ja = false) {
  const j = abertas.get(chave);
  if (!j) return;
  abertas.delete(chave);
  clearTimeout(j.timer);
  if (j.chip) j.chip.remove();
  const el = j.el;
  if (el.classList.contains('expandida')) document.body.classList.remove('foco');  // o HUD volta
  if (ja || reduz || !cheia || j.min) el.remove();
  else {  // volta para dentro do reator
    const r = el.getBoundingClientRect();
    el.style.pointerEvents = 'none';
    el.animate([{ transform: 'none', opacity: 1 },
                { transform: `translate(${cx - r.left - r.width / 2}px, ${cy - r.top - r.height / 2}px) scale(.2)`, opacity: 0 }],
      { duration: 380, easing: 'cubic-bezier(.6,0,.8,.4)' }).onfinish = () => el.remove();
  }
}

function fechaTudo() { for (const chave of [...abertas.keys()]) fecha(chave, true); }

// ---------- doca: minimizar e trazer de volta ----------
const doca = cria('div'); doca.id = 'doca'; camada.append(doca);
const DOCA_MAX = 6, DOCA_MS = 10 * 60000;  // até 6 na lateral; cada um fica 10 minutos
let seqJanela = 0;

function tituloCurto(tipo, valor) {
  const d = jsonDe(valor);
  const t = tipo === 'pesquisa' && d ? d.titulo || d.tema : tipo === 'clima' ? valor.split(':')[0] : valor.split('\n').find(l => l.trim());
  return String(t || '').trim().slice(0, 80);
}

function minimiza(j) {
  if (!j || j.min || !abertas.has(j.chave)) return;
  if (j.el.classList.contains('expandida')) expande(j.el, false);
  j.min = true; j.parado = false; clearTimeout(j.timer);
  const chip = cria('button', `chip c-${j.tipo}`);
  chip.type = 'button'; chip.title = 'Trazer para o centro';
  const ic = cria('span', 'icone-tipo'), txt = cria('span', 'chip-txt'), x = cria('span', 'chip-x', '×');
  ic.append(icone(ICONE_TIPO[j.tipo]));
  txt.append(cria('small', '', j.rotulo), cria('b', '', j.titulo || j.rotulo));
  x.title = 'Fechar'; x.onclick = (e) => { e.stopPropagation(); fecha(j.chave); };
  chip.append(ic, txt, x);
  chip.onclick = () => restaura(j.chave);
  doca.prepend(chip); j.chip = chip;
  for (const c of [...doca.children].slice(DOCA_MAX)) {  // doca cheia: o mais antigo sai
    const velho = [...abertas.values()].find(o => o.chip === c);
    if (velho) fecha(velho.chave, true); else c.remove();
  }
  j.el.classList.add('min');
  if (reduz || !cheia) j.el.hidden = true;
  else {  // encolhe até a miniatura
    const r = j.el.getBoundingClientRect(), c = chip.getBoundingClientRect();
    j.el.style.pointerEvents = 'none'; j.el.style.transformOrigin = '0 0';
    j.el.animate([{ transform: 'none', opacity: 1 },
                  { transform: `translate(${c.left - r.left}px, ${c.top - r.top}px) scale(${c.width / r.width}, ${c.height / r.height})`, opacity: 0 }],
      { duration: 420, easing: 'cubic-bezier(.6,0,.4,1)' }).onfinish = () => {
        j.el.style.pointerEvents = ''; j.el.style.transformOrigin = '';
        if (j.min) j.el.hidden = true;
      };
    chip.animate([{ opacity: 0, transform: 'translateX(-24px)' }, { opacity: 1, transform: 'none' }], { duration: 320, delay: 260, fill: 'backwards' });
  }
  j.timer = setTimeout(() => fecha(j.chave, true), DOCA_MS);
}

function restaura(chave) {
  const j = abertas.get(chave);
  if (!j || !j.min) return;
  const c = j.chip.getBoundingClientRect();
  for (const o of [...abertas.values()]) if (o !== j && PALCO.has(o.tipo) && !o.min) minimiza(o);  // troca de lugar com o do centro
  j.chip.remove(); j.chip = null;
  j.min = false; j.el.hidden = false; j.el.classList.remove('min');
  poe(j.el, j.tipo); frente(j.el);
  if (!reduz) {  // cresce da miniatura até o centro
    const r = j.el.getBoundingClientRect();
    j.el.style.transformOrigin = '0 0';
    j.el.animate([{ transform: `translate(${c.left - r.left}px, ${c.top - r.top}px) scale(${c.width / r.width}, ${c.height / r.height})`, opacity: 0 },
                  { transform: 'none', opacity: 1 }], { duration: 420, easing: 'cubic-bezier(.2,.8,.2,1)' })
      .onfinish = () => { j.el.style.transformOrigin = ''; };
  }
  agenda(j, 30000);
}


// Estados, fala e cartões
const elFala = document.getElementById('fala'), elCartoes = document.getElementById('cartoes');
const lv = document.getElementById('lv'), lb = document.getElementById('lb');
function muda(s) {
  if (!ESTADOS[s]) return;
  estado = s; elEstado.textContent = ESTADOS[s].txt; document.body.dataset.estado = s;
  if (s === 'pensando') { fecha('confirmar'); tiraConfirmar(); }  // a resposta chegou (por voz ou digitada)
}
function cartao(rotulo, valor, ms = 7000) {
  rotulo = String(rotulo ?? ''); valor = String(valor ?? '');
  const tipo = tipoDe(rotulo, valor);
  if (tipo === 'confirmar') ms = 60000;  // fica até a resposta (o Jarvis espera 1 minuto)
  else if (tipo === 'aviso') ms = Math.max(ms, 12000);
  else if (tipo === 'pesquisa') ms = Math.max(ms, 45000);
  else if (tipo === 'metrica') ms = Math.max(ms, 20000);
  else if (remoto) ms = Math.max(ms * 4, 30000);  // no celular dá mais tempo para ler
  if (cheia) return abreJanela(rotulo, valor, ms);
  const d = document.createElement('div'); d.className = 'cartao';
  // no celular o cartão mostra igual às janelas (clima grande, lista, balão do zap, sim/não)
  const rico = tipo === 'pesquisa' || tipo === 'metrica';  // JSON nunca aparece como texto
  d.append(cria('small', '', rotulo), remoto || rico ? conteudo(tipo, valor) : cria('strong', '', valor));
  if (tipo === 'confirmar') { d.classList.add('confirmar'); if (!remoto) d.append(simNao()); }
  elCartoes.prepend(d);
  while (elCartoes.children.length > 3) elCartoes.lastChild.remove();
  setTimeout(() => { d.classList.add('sai'); setTimeout(() => d.remove(), 400); }, ms);
}

// Chamado pelo Python (ui.py)
window.setEstado = muda;
window.mostraFala = (texto) => { elFala.textContent = lb.textContent = texto || ''; };
const elDisse = document.getElementById('disse');
window.mostraVoce = (texto) => {
  lv.textContent = texto || ''; lb.textContent = '';
  if (remoto) { elDisse.textContent = texto ? `Você: ${texto}` : ''; elFala.textContent = ''; }
};
window.cartao = cartao;
window.mostraNome = (nome) => {
  nome = String(nome || '').trim();
  if (!nome) return;
  document.querySelector('h1').textContent = nome.toUpperCase();
  document.getElementById('eu').textContent = nome;
  document.getElementById('nomeSenha').textContent = nome.toUpperCase();
  document.title = nome;
  document.getElementById('pedido').placeholder = remoto ? 'Digite ou toque no microfone' : `Digite um pedido ou diga "${nome}"`;
};

// Botões e caixa de texto falam com o Python (ui.py -> Api); no celular, pela internet (celular.py)
const api = () => remoto ? celular : (window.pywebview && window.pywebview.api) || null;
// Apertar o – ou o × não começa a arrastar a janela (senão, ao soltar depois de arrastar, fecharia o Jarvis),
// e o clique não deixa o botão com foco (senão o – e o × ficam aparecendo depois de minimizar e voltar)
document.querySelector('.botoes').addEventListener('mousedown', (e) => { e.stopPropagation(); e.preventDefault(); });
document.getElementById('fechar').onclick = () => api() && api().fechar();
document.getElementById('minimizar').onclick = () => api() && api().minimizar();
addEventListener('keydown', (e) => {
  if (e.key !== 'Escape' || !cheia) return;
  const topo = [...abertas.values()].filter(j => !j.min).sort((a, b) => b.el.style.zIndex - a.el.style.zIndex)[0];
  if (topo) fecha(topo.chave);
});
const campo = document.getElementById('pedido');
function enviaTexto() {
  const texto = campo.value.trim();
  if (remoto) destrava();  // o Enter do teclado também conta como toque: a voz da resposta pode tocar
  if (texto && api()) { api().pedido(texto); campo.value = ''; }
  if (remoto) atualizaBotao();
}
document.getElementById('form').addEventListener('submit', (e) => { e.preventDefault(); enviaTexto(); });

// ============ Celular ============
// Aberta pelo celular: pede a senha uma vez, busca as novidades do Bolha (estado, legendas, janelas e a voz)
// e manda os pedidos digitados, o áudio do microfone e o "sim". A voz da resposta toca aqui, não no PC.
const CABECALHO = { 'X-Bolha': '1', 'ngrok-skip-browser-warning': '1' };
const SILENCIO = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
const somFala = new Audio(), botao = document.getElementById('acao'), entrada = document.getElementById('entrada');
let ultimo = 0, buscando = false, tocando = false, destravado = false, pendente = false, gravador = null;

async function envia(caminho, corpo, tipo = 'application/json') {
  const r = await fetch(caminho, { method: 'POST', credentials: 'same-origin', headers: { ...CABECALHO, 'Content-Type': tipo },
    body: tipo === 'application/json' ? JSON.stringify(corpo) : corpo });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && caminho !== '/entrar') pedeSenha();
  if (!r.ok) throw new Error(d.erro || `O PC não respondeu (erro ${r.status}).`);
  return d;
}
const avisa = (texto) => mostraFala(texto);
const celular = { pedido: (texto) => { envia('/pedido', { texto }).catch(e => avisa(e.message)); } };

function chegou(e) {
  if (e.tipo === 'estado') { if (!gravador && !(tocando && e.valor === 'parado')) muda(e.valor); }
  else if (e.tipo === 'voce') mostraVoce(e.valor);
  else if (e.tipo === 'fala') mostraFala(e.valor);
  else if (e.tipo === 'nome') mostraNome(e.valor);
  else if (e.tipo === 'cartao') cartao(e.titulo, e.texto, e.ms);
  else if (e.tipo === 'audio') toca(e.url);
}

function semConexao(sim) {
  document.body.classList.toggle('offline', sim);
  elEstado.textContent = sim ? 'SEM CONEXÃO COM O PC' : ESTADOS[estado].txt;
}

// Pergunta "tem novidade?" e o PC segura a resposta até ter (ou 25 s): chega na hora, sem gastar bateria à toa
async function novidades() {
  if (buscando || !entrada.hidden) return;
  buscando = true;
  let deNovo = 0;
  try {
    for (;;) {
      const r = await fetch(`/eventos?desde=${ultimo}`, { headers: CABECALHO, credentials: 'same-origin', cache: 'no-store' });
      if (r.status === 401) { pedeSenha(); return; }
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      semConexao(false);
      for (const e of d.eventos) { try { chegou(e); } catch (err) { console.error(err); } }  // um evento ruim não trava a fila
      ultimo = d.ultimo;
    }
  } catch {
    semConexao(true);
    deNovo = 3000;
  } finally {
    buscando = false;
    if (deNovo) setTimeout(novidades, deNovo);
  }
}

// O celular só toca som depois de um toque na tela: o primeiro toque "destrava" o tocador da voz
function destrava() {
  if (destravado) return;
  destravado = true;
  somFala.src = SILENCIO;
  somFala.play().catch(() => { destravado = false; });
}
async function toca(url) {
  try {
    const r = await fetch(url, { headers: CABECALHO, credentials: 'same-origin' });
    if (!r.ok) return;
    const antigo = somFala.src;
    somFala.src = URL.createObjectURL(await r.blob());
    if (antigo.startsWith('blob:')) URL.revokeObjectURL(antigo);
    await somFala.play();
  } catch {
    pendente = true;
    avisa('Toque na tela para ouvir a resposta.');
  }
}
somFala.onplaying = () => { if (somFala.src.startsWith('blob:')) { tocando = true; pendente = false; muda('falando'); } };
somFala.onended = somFala.onpause = () => { if (tocando) { tocando = false; muda('parado'); } };

// Microfone: toca uma vez para falar, outra para mandar (para sozinho em 30 s)
async function microfone() {
  if (gravador) { gravador.stop(); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
    avisa(location.protocol === 'https:' ? 'Este navegador não grava áudio. Digite o pedido.'
      : 'O microfone só funciona pelo link https (ngrok). Digite o pedido.');
    return;
  }
  let fluxo;
  try { fluxo = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); }
  catch { avisa('Libere o microfone para este site nas configurações do navegador.'); return; }
  const tipo = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'].find(t => MediaRecorder.isTypeSupported(t));
  const g = new MediaRecorder(fluxo, tipo ? { mimeType: tipo } : undefined), pedacos = [], inicio = Date.now();
  const limite = setTimeout(() => g.state !== 'inactive' && g.stop(), 30000);
  gravador = g;
  g.ondataavailable = (e) => { if (e.data.size) pedacos.push(e.data); };
  g.onstop = async () => {
    fluxo.getTracks().forEach(t => t.stop());
    clearTimeout(limite);
    gravador = null;
    botao.classList.remove('gravando');
    atualizaBotao();
    if (Date.now() - inicio < 500) { muda('parado'); return; }  // foi só um toque
    const audio = new Blob(pedacos, { type: g.mimeType || tipo || 'audio/webm' });
    muda('pensando');
    try {
      const d = await envia('/ouvir', audio, audio.type);
      if (!d.texto) { muda('parado'); avisa('Não entendi. Toque no microfone e fale de novo.'); }
    } catch (e) { muda('parado'); avisa(e.message); }
  };
  g.start();
  botao.classList.add('gravando');
  botao.title = 'Parar e enviar';
  muda('ouvindo');
}

function atualizaBotao() {
  const escrito = campo.value.trim() !== '';
  botao.classList.toggle('escrito', escrito && !gravador);
  if (!gravador) botao.title = escrito ? 'Enviar' : 'Falar';
}

function pedeSenha() {
  entrada.hidden = false;
  setTimeout(() => document.getElementById('senha').focus(), 50);
}
document.getElementById('formSenha').addEventListener('submit', async (e) => {
  e.preventDefault();
  const senha = document.getElementById('senha'), erro = document.getElementById('erroSenha');
  erro.textContent = '';
  try {
    await envia('/entrar', { senha: senha.value });
    senha.value = '';
    entrada.hidden = true;
    ultimo = 0;
    novidades();
  } catch (err) { erro.textContent = err.message; }
});

if (remoto) {
  campo.placeholder = 'Digite ou toque no microfone';
  botao.onclick = () => { if (campo.value.trim() && !gravador) enviaTexto(); else microfone(); };
  campo.addEventListener('input', atualizaBotao);
  addEventListener('pointerdown', () => {  // qualquer toque destrava o som (e toca a resposta que ficou esperando)
    destrava();
    if (pendente) { pendente = false; somFala.play().catch(() => {}); }
  }, true);
  atualizaBotao();
  novidades();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) novidades(); });
}

addEventListener('resize', tam); tam();
requestAnimationFrame(quadro);
</script>
