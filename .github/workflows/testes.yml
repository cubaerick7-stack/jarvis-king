name: testes
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest psutil
      - run: python -m pytest -q

  # Mesmo Windows e Python do PC do Jarvis: confere se todos os pacotes instalam e carregam.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pip check
      - name: Importa os pacotes
        run: python -c "import pycaw.pycaw, pyautogui, mss, pypdf, psutil, pyperclip, pygetwindow, playwright.sync_api, vosk, sounddevice, edge_tts, webview, clr, webview.platforms.winforms; print('ok')"
      - name: Importa o Jarvis
        working-directory: windows
        run: python -c "import ferramentas, memoria, navegador, nuvem, ui, voz, jarvis_ai; print('ok')"
      - name: Testes no Windows (ainda informativo)
        continue-on-error: true
        run: python -m pytest -q
